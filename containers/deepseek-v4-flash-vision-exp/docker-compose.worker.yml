name: deepseek-v4-flash-vision-exp
services:
  vllm-vision:
    image: ${VISION_IMAGE:?verified digest-pinned image required}
    container_name: deepseek-v4-flash-vision-exp-worker
    network_mode: host
    ipc: host
    restart: "no"
    gpus: all
    devices:
      - /dev/infiniband:/dev/infiniband
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: -1
      stack: 67108864
    labels:
      com.docker.compose.project: deepseek-v4-flash-vision-exp
      com.docker.compose.service: vllm-vision
      com.dgx-spark.model-id: deepseek-v4-flash-vision-exp
      com.dgx-spark.guard-sha256: "ec0740e6194040aa9d860818fe57201529fb13367299182c1cc5d2edd435fca0"
      com.dgx-spark.role: worker
    environment:
      VISION_ROLE: ${VISION_ROLE}
      VLLM_HOST_IP: ${VLLM_HOST_IP}
      MASTER_ADDR: ${MASTER_ADDR}
      MASTER_PORT: ${MASTER_PORT}
      NCCL_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME}
      GLOO_SOCKET_IFNAME: ${GLOO_SOCKET_IFNAME}
      NCCL_IB_HCA: ${NCCL_IB_HCA}
      NCCL_IB_GID_INDEX: ${NCCL_IB_GID_INDEX}
      NCCL_CROSS_NIC: ${NCCL_CROSS_NIC}
      NCCL_NET: ${NCCL_NET}
      NCCL_IB_DISABLE: ${NCCL_IB_DISABLE}
      NCCL_IB_ADDR_FAMILY: ${NCCL_IB_ADDR_FAMILY}
      NCCL_IB_ROCE_VERSION_NUM: ${NCCL_IB_ROCE_VERSION_NUM}
      NCCL_CUMEM_ENABLE: ${NCCL_CUMEM_ENABLE}
      NCCL_NVLS_ENABLE: ${NCCL_NVLS_ENABLE}
      NCCL_IGNORE_CPU_AFFINITY: ${NCCL_IGNORE_CPU_AFFINITY}
      NCCL_DEBUG: ${NCCL_DEBUG}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_MEDIA_URL_ALLOW_REDIRECTS: "0"
      DSV4_VISION_TRACE: "1"
      DSV4_VISION_TRACE_NONCE: ${DSV4_VISION_TRACE_NONCE:?trace nonce required}
      DSV4_VISION_TRACE_DIR: /state/native-trace
    volumes:
      - /opt/deepseek-v4-flash-vision-exp/overlays/vision_media_guard.ec0740e6194040aa9d860818fe57201529fb13367299182c1cc5d2edd435fca0.py:/opt/deepseek-v4-flash-vision-exp/vision_media_guard.py:ro
      - ${VISION_MODEL_ROOT}:/models/deepseek-v4-flash-vision-exp:ro
      - /home/operator/.local/state/deepseek-v4-flash-vision-exp:/state
    entrypoint: ["python3", "/opt/deepseek-v4-flash-vision-exp/launch_vllm.py"]
    command:
      - /models/deepseek-v4-flash-vision-exp
      - --served-model-name
      - deepseek-v4-flash-vision-exp
      - --host
      - 127.0.0.1
      - --port
      - "18889"
      - --tensor-parallel-size
      - "2"
      - --pipeline-parallel-size
      - "1"
      - --distributed-executor-backend
      - mp
      - --nnodes
      - "2"
      - --node-rank
      - "1"
      - --master-addr
      - 192.0.2.33
      - --master-port
      - "25001"
      - --headless
      - --enable-auto-tool-choice
      - --tool-call-parser
      - deepseek_v4
      - --reasoning-parser
      - deepseek_v4
      - --enable-expert-parallel
      - --max-model-len
      - "${VISION_MAX_MODEL_LEN:-32768}"
      - --max-num-seqs
      - "1"
      - --kv-cache-dtype
      - fp8
      - --gpu-memory-utilization
      - "0.85"
      - --middleware
      - vision_media_guard.VisionMediaGuard
      - --allowed-media-domains
      - deepseek-v4-vision.invalid
