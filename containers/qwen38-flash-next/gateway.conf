worker_processes 1;
events { worker_connections 256; }
http {
    map_hash_bucket_size 256;
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 32m;
    client_body_timeout 30s;
    include /run/secrets/qwen38-auth.conf;
    map "$request_method:$uri" $qwen_route_allowed {
        default 0;
        "GET:/v1/models" 1;
        "POST:/v1/chat/completions" 1;
        "POST:/v1/completions" 1;
    }
    server {
        listen 192.0.2.30:11434;
        include /run/qwen38-flash-next/admission.conf;
        if ($qwen_auth_ok = 0) { return 401; }
        if ($qwen_route_allowed = 0) { return 404; }
        if ($qwen_accepting = 0) { return 503; }
        location / {
            proxy_pass http://127.0.0.1:18890;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Authorization "";
            proxy_set_header Host localhost;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
    }
}
