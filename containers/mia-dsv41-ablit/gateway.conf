worker_processes 1;
events { worker_connections 256; }
http {
    map_hash_bucket_size 256;
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 32m;
    client_body_timeout 30s;
    include /run/secrets/mia-dsv41-auth.conf;
    map "$request_method:$uri" $mia_route_allowed {
        default 0;
        "GET:/v1/models" 1;
        "POST:/v1/chat/completions" 1;
        "POST:/v1/completions" 1;
    }
    server {
        listen 192.0.2.30:11434;
        include /run/mia-dsv41-ablit/admission.conf;
        if ($mia_auth_ok = 0) { return 401; }
        if ($mia_route_allowed = 0) { return 404; }
        if ($mia_accepting = 0) { return 503; }
        location / {
            include /run/mia-dsv41-ablit/upstream-auth.conf;
            proxy_pass http://127.0.0.1:8888;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
    }
}
